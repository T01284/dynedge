[platformio]
src_dir = main
default_envs = esp32p4_espdl

[env:esp32p4_espdl]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-p4-evboard
framework = espidf
monitor_speed = 115200
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
upload_speed = 1500000
build_flags =
	-DFER_DEVICE_NAME=\"esp32p4\"
	-DBOARD_HAS_PSRAM
	-DFER_UART_TX_GPIO=54
	-DFER_UART_RX_GPIO=53
board_build.cmake_extra_args =
	-DSDKCONFIG_DEFAULTS=sdkconfig.defaults

[env:esp32s3_espdl]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.37/platform-espressif32.zip
board = esp32-s3-devkitc1-n16r8
framework = espidf
monitor_speed = 115200
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
upload_speed = 921600
build_flags =
	-DFER_DEVICE_NAME=\"esp32s3\"
	-DBOARD_HAS_PSRAM
	-DFER_UART_TX_GPIO=43
	-DFER_UART_RX_GPIO=44
board_build.cmake_extra_args =
	-DSDKCONFIG_DEFAULTS=sdkconfig.defaults.esp32s3
